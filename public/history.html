<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ Codex · 消息历史</title><style>
.loading{display:flex;align-items:center;gap:10px;padding:18px 0}.spinner{width:20px;height:20px;flex:none;border:3px solid #d5e3d8;border-top-color:#20593e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
#users[inert],#sessions[inert]{pointer-events:none;user-select:none}
:root{font:15px/1.6 system-ui;color:#203029;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}header{padding:18px 28px;border-bottom:1px solid #ddd;background:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}h3{font-size:13px;color:#6e7c71;margin:20px 0 8px}a{color:#1e674a}main{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1250px;margin:auto;min-height:85vh}aside{padding:16px 12px;border-right:1px solid #ddd}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d5ddd5;border-radius:8px;padding:8px 12px;background:#fff;color:inherit}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}.user,.session{display:block;width:100%;text-align:left;margin:8px 0}.user.selected,.session.selected{background:#20593e;color:white}.session span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session small{display:block;font-size:11px;opacity:.75}.content{padding:24px;min-width:0}.toolbar,.pagination,.titlebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.titlebar{margin:14px 0}.titlebar h2{flex:1;word-break:break-word}.toolbar{position:sticky;top:0;background:#f5f6f3;padding:10px 0;z-index:2}.toolbar input{flex:1;min-width:150px;padding:9px;border:1px solid #ccc;border-radius:8px}.pagination{font-size:13px;padding:10px 0}.message{border:1px solid #dbe2d9;border-radius:12px;padding:16px 18px;margin:16px 0;max-width:92%;background:#fff;word-break:break-word;content-visibility:auto;contain-intrinsic-size:auto 130px}.message.outbound{background:#edf5ec;margin-left:auto}.message.error{border-color:#db988f;background:#fff0ed}.message.assets{background:#f5f3e9}.meta{font-size:12px;color:#6e7c71;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.copy{font-size:12px;padding:3px 10px;margin-left:auto;white-space:nowrap}.text{white-space:pre-wrap}.attachment{margin-top:12px}.attachment button{font-size:13px}.attachment img,.attachment video{max-width:100%;max-height:350px;border-radius:8px;margin-top:10px}.attachment audio{width:100%;margin-top:10px}.status{color:#59685e;font-size:13px}#empty{padding:60px 0;text-align:center;color:#788477}#renameForm input{width:70%;padding:8px;border:1px solid #ccc;border-radius:8px}#newMessages{background:#e6f1e4;margin:10px 0}#sessionTitle{font-weight:600}@media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd;padding:8px}#users,#sessions{display:flex;overflow:auto;gap:8px}.user,.session{min-width:160px;max-width:220px}.content{padding:12px}.message{max-width:100%}}</style>
<header><h1>QQ Codex · 消息历史</h1><a href="/">机器人配置</a></header><main><aside><h3>账号</h3><div id="users"></div><h3>独立会话</h3><div id="sessions"></div><button id="moreSessions" hidden>更早的会话</button></aside><section class="content"><div class="status" id="state">正在读取连接状态…</div><div class="titlebar"><h2 id="sessionTitle">请选择会话</h2><button id="rename" hidden>修改标题</button></div><form id="renameForm" hidden><input id="titleInput" maxlength="80" aria-label="会话标题" required><button>保存标题</button><button type="button" id="cancelRename">取消</button></form><div class="toolbar"><input id="search" aria-label="搜索本会话" placeholder="搜索当前会话的消息"><button id="export">导出本会话</button></div><div class="status" id="exported" hidden></div><div class="pagination"><button id="newer" disabled>较新一页</button><span id="pageInfo">0 条消息</span><button id="older" disabled>更早一页</button><button id="latest">最新</button><label>每页 <select id="pageSize" aria-label="每页条数"><option>20</option><option selected>30</option><option>50</option><option>100</option></select> 条</label></div><div id="loading" class="status loading" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span>正在加载会话消息…</span></div><button id="newMessages" hidden></button><div id="messages"></div><div id="empty">请选择账号与会话</div></section></main><noscript>页面需要启用 JavaScript 才能读取本机服务。</noscript><script src="/ui-client.js"></script><script src="/history.js"></script></html>
