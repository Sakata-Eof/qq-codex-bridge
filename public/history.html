<div class="history-workspace">
  <aside class="history-rail" aria-label="历史账号与会话">
    <div class="rail-heading"><h2>账号</h2><small>独立记录</small></div>
    <div id="users" aria-label="选择历史账号"></div>
    <div class="rail-heading sessions-heading"><h2>会话</h2><small>按最近活动</small></div>
    <div id="sessions" aria-label="选择历史会话"></div>
    <button id="moreSessions" class="secondary" type="button" hidden>加载更早的会话</button>
    <p class="history-connection" id="state" role="status">正在读取连接状态…</p>
  </aside>
  <section class="history-conversation" aria-label="会话消息">
    <div class="conversation-tools">
      <div class="titlebar"><h2 id="sessionTitle">请选择会话</h2><button id="rename" class="secondary" type="button" hidden>修改标题</button></div>
      <form id="renameForm" class="rename-form" hidden><input id="titleInput" maxlength="80" aria-label="会话标题" required><button type="submit">保存标题</button><button class="secondary" type="button" id="cancelRename">取消</button></form>
      <div class="toolbar">
        <label class="history-search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" aria-label="搜索本会话" placeholder="搜索当前会话的消息"></label>
        <button id="export" class="secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>导出会话</button>
      </div>
      <div class="history-exported" id="exported" role="status" hidden></div>
      <details id="taskPanel" class="task-panel">
        <summary>账号最近任务<span>执行与投递状态</span></summary>
        <div class="task-heading"><span class="task-note">查看此账号最近的任务，不改变当前会话</span><button id="taskRefresh" class="secondary" type="button">刷新任务</button></div>
        <div id="taskDiagnostics" class="task-status" aria-live="polite"></div>
        <div id="taskLoading" class="status loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><span>正在读取任务状态…</span></div>
        <div id="taskError" class="task-error" role="status" hidden></div>
        <div id="taskEmpty" class="task-note">展开后读取；升级后的新任务会在这里记录</div>
        <div id="taskList"></div>
      </details>
    </div>
    <div id="historyFeed" class="history-feed" tabindex="0" aria-label="消息记录">
      <div id="loading" class="status loading" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span>正在加载会话消息…</span></div>
      <button id="newMessages" type="button" hidden></button>
      <div id="messages"></div>
      <div id="empty" class="history-empty">请选择账号与会话</div>
    </div>
    <div class="pagination">
      <span id="pageInfo">0 条消息</span>
      <div class="page-controls"><button id="newer" class="secondary" type="button" disabled aria-label="较新一页">较新</button><button id="older" class="secondary" type="button" disabled aria-label="更早一页">更早</button><button id="latest" class="secondary" type="button">最新</button><label>每页 <select id="pageSize" aria-label="每页条数"><option>20</option><option selected>30</option><option>50</option><option>100</option></select></label></div>
    </div>
  </section>
</div>
